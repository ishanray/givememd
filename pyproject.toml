[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "givememd"
version = "0.1.0"
description = "Put givememd in front of any URL and get clean, token-lean markdown for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["markdown", "llm", "web", "scraping", "html-to-markdown", "mcp", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "selectolax>=0.3.27",
  "curl_cffi>=0.7",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
givememd = "givememd.cli:main"
givememd-server = "givememd.server:main"
givememd-mcp = "givememd.mcp_server:main"

[project.urls]
Homepage = "https://givememd.com"

[tool.hatch.build.targets.wheel]
packages = ["givememd"]

[tool.hatch.build.targets.sdist]
include = ["/givememd", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
markers = ["live: hits the real internet"]
addopts = "-m 'not live'"
testpaths = ["tests"]
