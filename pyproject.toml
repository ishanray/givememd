[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "givememd"
version = "0.1.0"
description = "Turn any web page into clean, token-lean markdown for LLMs. Fetches from your own machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "llm", "web", "scraping", "html-to-markdown", "mcp", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "selectolax>=0.3.27",
  "curl_cffi>=0.7",
  "tiktoken>=0.7",
  "playwright>=1.40",            # JS rendering is part of the core: drives an installed Chrome/Edge, or downloads one once
]

[project.optional-dependencies]
browser = []                     # kept so old install commands still work; the browser driver is now core
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
givememd = "givememd.cli:main"
givememd-server = "givememd.server:main"
givememd-mcp = "givememd.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ishanray/givememd"
Repository = "https://github.com/ishanray/givememd"
Issues = "https://github.com/ishanray/givememd/issues"

[tool.hatch.build.targets.wheel]
packages = ["givememd"]

[tool.hatch.build.targets.sdist]
include = ["/givememd", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
markers = ["live: hits the real internet"]
addopts = "-m 'not live'"
testpaths = ["tests"]
